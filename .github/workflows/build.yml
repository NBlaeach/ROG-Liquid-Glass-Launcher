name: Build ROG Liquid Glass Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ROG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/rog-release.jks
          chmod 600 app/rog-release.jks

      - name: Build APK
        env:
          ROG_STORE_PASSWORD: ${{ secrets.ROG_STORE_PASSWORD }}
          ROG_KEY_ALIAS: ${{ secrets.ROG_KEY_ALIAS }}
          ROG_KEY_PASSWORD: ${{ secrets.ROG_KEY_PASSWORD }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ROG-Liquid-Glass-Launcher
          path: app/build/outputs/apk/debug/app-debug.apk
